// ── Shared hooks ──
function useFormState() {
  const [groupName, setGroupName] = React.useState('');
  const [account, setAccount] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [errors, setErrors] = React.useState({});
  const [snackbar, setSnackbar] = React.useState({ open: false, message: '', severity: 'success' });

  const validate = () => {
    const e = {};
    if (!groupName.trim()) e.groupName = '群組名稱為必填';
    if (!account.trim()) e.account = '帳號為必填';
    if (!password.trim()) e.password = '密碼為必填';
    if (groupName.length > 100) e.groupName = '群組名稱不能超過 100 字元';
    if (account.length > 100) e.account = '帳號不能超過 100 字元';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    // Check uniqueness against mock data
    const dup = MOCK_ROWS.find(r => r.groupName === groupName.trim() && r.account === account.trim());
    if (dup) {
      setSnackbar({ open: true, message: `群組「${groupName}」+ 帳號「${account}」已存在`, severity: 'error' });
      return;
    }
    setSnackbar({ open: true, message: '新增成功！', severity: 'success' });
    setGroupName(''); setAccount(''); setPassword(''); setErrors({});
  };

  return { groupName, setGroupName, account, setAccount, password, setPassword, errors, snackbar, setSnackbar, handleSubmit };
}

function useTableState() {
  const [filter, setFilter] = React.useState('');
  const [page, setPage] = React.useState(0);
  const rowsPerPage = 20;

  const filtered = MOCK_ROWS.filter(r =>
    r.groupName.toLowerCase().includes(filter.toLowerCase()) ||
    r.account.toLowerCase().includes(filter.toLowerCase())
  );
  const paged = filtered.slice(page * rowsPerPage, page * rowsPerPage + rowsPerPage);

  return { filter, setFilter, page, setPage, rowsPerPage, filtered, paged };
}

            sx={{ width: 280 }}

              startAdornment: <InputAdornment position="start"><span className="material-icons" style={{fontSize:18}}>search</span></InputAdornment>
            }} />
        </Box>

        {/* Full-width table */}
        <Paper variant="outlined">
          <TableContainer sx={{ maxHeight: 'calc(100vh - 200px)' }}>
            <Table stickyHeader size="small">
              <TableHead>
                <TableRow>
                  <TableCell sx={{ fontWeight: 700, bgcolor: '#fafafa' }}>#</TableCell>
                  <TableCell sx={{ fontWeight: 700, bgcolor: '#fafafa' }}>群組名稱</TableCell>
                  <TableCell sx={{ fontWeight: 700, bgcolor: '#fafafa' }}>帳號</TableCell>
                  <TableCell sx={{ fontWeight: 700, bgcolor: '#fafafa' }}>創建者</TableCell>
                  <TableCell sx={{ fontWeight: 700, bgcolor: '#fafafa' }}>創建時間</TableCell>
                </TableRow>
              </TableHead>
              <TableBody>
                {table.paged.map((row, i) => (
                  <TableRow key={row.id} hover>
                    <TableCell sx={{ color: '#aaa' }}>{table.page * table.rowsPerPage + i + 1}</TableCell>
                    <TableCell>
                      <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                        <Box sx={{ width: 8, height: 8, borderRadius: '50%',
                          bgcolor: ['#1976d2','#e91e63','#4caf50','#ff9800','#9c27b0','#00bcd4'][
                            row.groupName.charCodeAt(0) % 6
                          ]
                        }} />
                        {row.groupName}
                      </Box>
                    </TableCell>
                    <TableCell sx={{ fontFamily: '"Roboto Mono", monospace', fontSize: 13 }}>{row.account}</TableCell>
                    <TableCell>{row.createdBy}</TableCell>
                    <TableCell sx={{ color: '#888', fontSize: 12 }}>{row.createdAt}</TableCell>
                  </TableRow>
                ))}
              </TableBody>
            </Table>
          </TableContainer>
          <TablePagination component="div" count={table.filtered.length} page={table.page}
            onPageChange={(_, p) => table.setPage(p)}
            rowsPerPage={table.rowsPerPage} rowsPerPageOptions={[20]}
            labelDisplayedRows={({from, to, count}) => `${from}–${to} / 共 ${count} 筆`} />
        </Paper>
      </Box>

      {/* FAB to open add dialog */}
      <Tooltip title="新增帳號" placement="left">
        <Fab color="primary" sx={{ position: 'fixed', right: 32, bottom: 80 }}
          onClick={() => setDialogOpen(true)}>
          <span className="material-icons">add</span>
        </Fab>
      </Tooltip>

      {/* Add dialog */}
      <Dialog open={dialogOpen} onClose={() => setDialogOpen(false)} maxWidth="sm" fullWidth>
        <DialogTitle sx={{ fontWeight: 600 }}>新增帳號</DialogTitle>
        <DialogContent>
          <Stack spacing={2} sx={{ mt: 1 }}>
            <TextField fullWidth size="small" label="群組名稱" value={form.groupName}
              onChange={e => form.setGroupName(e.target.value)}
              error={!!form.errors.groupName} helperText={form.errors.groupName} />
            <TextField fullWidth size="small" label="帳號" value={form.account}
              onChange={e => form.setAccount(e.target.value)}
              error={!!form.errors.account} helperText={form.errors.account} />
            <TextField fullWidth size="small" label="密碼" type="password" value={form.password}
              onChange={e => form.setPassword(e.target.value)}
              error={!!form.errors.password} helperText={form.errors.password} />
          </Stack>
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}>
          <Button onClick={() => setDialogOpen(false)}>取消</Button>
          <Button variant="contained" onClick={handleSubmitAndClose}>送出</Button>
        </DialogActions>
      </Dialog>

      <Snackbar open={form.snackbar.open} autoHideDuration={3000}
        onClose={() => form.setSnackbar({...form.snackbar, open: false})}
        anchorOrigin={{ vertical: 'top', horizontal: 'center' }}>
        <Alert severity={form.snackbar.severity} variant="filled">{form.snackbar.message}</Alert>
      </Snackbar>
    </Box>
  );
}

// ── Variant Switcher ──
const VARIANTS = [
  { key: 'A', name: 'Classic Top-Down', component: VariantA },
  { key: 'B', name: 'Sidebar Dashboard', component: VariantB },
  { key: 'C', name: 'Tabs + FAB Dialog', component: VariantC },
];

function PrototypeSwitcher({ current, onChange }) {
  const idx = VARIANTS.findIndex(v => v.key === current);
  const prev = VARIANTS[(idx - 1 + VARIANTS.length) % VARIANTS.length].key;
  const next = VARIANTS[(idx + 1) % VARIANTS.length].key;

  React.useEffect(() => {
    const handler = (e) => {
      if (['INPUT','TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable) return;
      if (e.key === 'ArrowLeft') onChange(prev);
      if (e.key === 'ArrowRight') onChange(next);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [prev, next]);

  return (
    <div className="prototype-switcher">
      <button onClick={() => onChange(prev)}>◀</button>
      <span className="label">{current} — {VARIANTS[idx].name}</span>
      <button onClick={() => onChange(next)}>▶</button>
    </div>
  );
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const [variant, setVariant] = React.useState(params.get('variant') || 'A');

  const changeVariant = (v) => {
    setVariant(v);
    const url = new URL(window.location);
    url.searchParams.set('variant', v);
    window.history.replaceState({}, '', url);
  };

  const V = VARIANTS.find(v => v.key === variant)?.component || VariantA;

  return (
    <>
      <V />
      <PrototypeSwitcher current={variant} onChange={changeVariant} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
